name: DataPulse CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Build, Lint & Verify Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --tb=short

      - name: Execute CLI Smoke Test
        run: |
          python -m datapulse.cli.main info
          python -m datapulse.cli.main generate --orders 500 --customers 50 --anomaly-rate 0.05
          python -m datapulse.cli.main validate --threshold 90.0
          python -m datapulse.cli.main transform --skip-gate
          python -m datapulse.cli.main warehouse init
          python -m datapulse.cli.main warehouse load
          python -m datapulse.cli.main warehouse mart monthly_revenue
          python -m datapulse.cli.main lineage --target v_mart_monthly_revenue
          python -m datapulse.cli.main evolution --dataset orders
